<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AhA</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0e0e10;
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }
        .stream-container {
            flex: 4;
            height: 100%;
            box-sizing: border-box;
            border-right: 2px solid #1f1f23;
        }
        .chat-container {
            flex: 1;
            height: 100%;
            background-color: #0e0e10;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="stream-container" id="video-box"></div>
    <div class="chat-container">
        <iframe id="twitch-chat" src="" allowfullscreen="true"></iframe>
    </div>
    <script>
        var currentDomain = window.location.hostname;
        var streamer = "h2p_gucio";
        var videoUrl = "https://player.twitch.tv/?channel=" + streamer + "&parent=" + currentDomain;
        var chatUrl = "https://twitchtheater.tv/embed/chat/?channel=" + streamer + "&theme=dark";
        document.getElementById('video-box').innerHTML = '<iframe src="' + videoUrl + '" allowfullscreen="true"></iframe>';
        document.getElementById('twitch-chat').src = chatUrl;
    </script>
</body>
</html>
