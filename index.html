<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AhA</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            height: 100vh;
            overflow: hidden;
        }
        #video-box {
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #trigger-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #9146FF;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            z-index: 9999;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #trigger-btn:hover {
            background-color: #772CE8;
        }
    </style>
</head>
<body>
    <button id="trigger-btn" onclick="openChat()">Chat</button>
    <div id="video-box"></div>
    <script>
        var currentDomain = window.location.hostname;
        var streamer = "h2p_gucio";
        var videoUrl = "https://player.twitch.tv/?channel=" + streamer + "&parent=" + currentDomain;
        document.getElementById('video-box').innerHTML = '<iframe src="' + videoUrl + '" allowfullscreen="true"></iframe>';
        function openChat() {
            var width = 340;
            var height = 700;
            var left = window.screen.width - width;
            var top = 0;
            var chatUrl = "https://www.twitch.tv/popout/" + streamer + "/chat";
            window.open(
                chatUrl, 
                "TwitchChat", 
                "width=" + width + ",height=" + height + ",left=" + left + ",top=" + top + ",menubar=no,toolbar=no,location=no,status=no"
            );
        }
        window.onload = function() {
            openChat();
        };
    </script>
</body>
</html>
