<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AhA</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0e0e10;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
            color: white;
        }
        #panel {
            background-color: #1f1f23;
            padding: 10px;
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid #2a2a30;
        }
        input {
            background: #2a2a30;
            border: 1px solid #444;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
        }
        button {
            background: #9146FF;
            border: none;
            color: white;
            padding: 6px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #772CE8;
        }
        #main-container {
            display: flex;
            flex: 1;
            height: 100%;
        }
        .stream-container {
            flex: 3;
            height: 100%;
            box-sizing: border-box;
            border-right: 2px solid #1f1f23;
        }
        .chat-container {
            flex: 1;
            height: 100%;
            background-color: #18181b;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div id="panel">
        <label>Streamer:</label>
        <input type="text" id="streamerInput" value="h2p_gucio">
        <label>Logi użytkownika:</label>
        <input type="text" id="userInput" value="h2p_gucio">
        <button onclick="loadContent()">Zastosuj</button>
    </div>

    <div id="main-container">
        <div class="stream-container" id="video-box"></div>
        <div class="chat-container" id="log-box"></div>
    </div>
    <script>
        function loadContent() {
            var currentDomain = window.location.hostname;
            var channel = document.getElementById('streamerInput').value.trim();
            var user = document.getElementById('userInput').value.trim();
            var videoUrl = "https://player.twitch.tv/?channel=" + channel + "&parent=" + currentDomain;
            var logUrl = "https://tv.supa.sh/logs?c=" + channel + "&u=" + user;
            document.getElementById('video-box').innerHTML = '<iframe src="' + videoUrl + '" allowfullscreen="true"></iframe>';
            document.getElementById('log-box').innerHTML = '<iframe src="' + logUrl + '"></iframe>';
        }
        window.onload = loadContent;
    </script>
</body>
</html>
